version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: rentalmanagementdb
      MYSQL_USER: root
      MYSQL_PASSWORD: Admin@123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django:
    build: .
    container_name: django_container
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rentalmanagementdb
      DB_USER: root
      DB_PASSWORD: Admin@123
    volumes:
      - .:/app
    command: >
      sh -c "python accommodationSearchApp/accommodationSearchApp/manage.py migrate &&
             gunicorn accommodationSearchApp.wsgi:application --bind 0.0.0.0:8000"

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./accommodationSearchApp/accommodationSearchApp/static:/static
    depends_on:
      - django

volumes:
  mysql_data:
