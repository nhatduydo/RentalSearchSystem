services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: rentalmanagementdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django:
    build: .
    container_name: django_container
    restart: always
    depends_on:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: rentalmanagementdb
    volumes:
      - ./accommodationSearchApp:/app
    command: >
      sh -c "
        sleep 20 &&
        python manage.py migrate &&
        gunicorn accommodationSearchApp.wsgi:application --bind 0.0.0.0:8000
      "

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./accommodationSearchApp/accommodationSearch/static:/static
    depends_on:
      - django

volumes:
  mysql_data:
